name: Release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./manifest.json').version")
          package=$(node -p "require('./package.json').version")
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$package" ]; then
            echo "tag=$tag manifest=$manifest package=$package must all match"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Package
        run: |
          name="Obsiwaita-${GITHUB_REF_NAME#v}"
          mkdir -p release/theme/Obsiwaita release/snippets
          cp dist/theme.css dist/manifest.json release/theme/Obsiwaita/
          cp dist/snippets/*.css release/snippets/
          (cd release/theme && zip -r "../$name.zip" Obsiwaita)
          (cd release && zip -r "$name-snippets.zip" snippets)
          cp dist/theme.css dist/manifest.json release/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/theme.css
            release/manifest.json
            release/Obsiwaita-*.zip
            release/Obsiwaita-*-snippets.zip
            dist/snippets/explorer-icons.css
            dist/snippets/vault-layout.css
