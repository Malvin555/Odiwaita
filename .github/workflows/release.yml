name: Release

on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example 1.0.1
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches manifest version
        run: |
          tag="${TAG#v}"
          manifest=$(node -p "require('./manifest.json').version")
          package=$(node -p "require('./package.json').version")
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$package" ]; then
            echo "tag=$tag manifest=$manifest package=$package must all match"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Package
        run: |
          name="Odiwaita-${TAG#v}"
          mkdir -p release/theme/Odiwaita release/snippets
          cp dist/theme.css dist/manifest.json release/theme/Odiwaita/
          cp dist/snippets/*.css release/snippets/
          (cd release/theme && zip -r "../$name.zip" Odiwaita)
          (cd release && zip -r "$name-snippets.zip" snippets)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            release/Odiwaita-*.zip
