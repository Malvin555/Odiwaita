name: Odiwaita
id: odiwaita
settings:
    -
        title: Appearance
        type: heading
        level: 2
        collapsed: false
    -
        id: adw-accent
        title: Accent color
        description: Same accent colors as GNOME Settings
        type: class-select
        default: adw-accent-blue
        allowEmpty: false
        options:
            -
                label: Blue
                value: adw-accent-blue
            -
                label: Teal
                value: adw-accent-teal
            -
                label: Green
                value: adw-accent-green
            -
                label: Yellow
                value: adw-accent-yellow
            -
                label: Orange
                value: adw-accent-orange
            -
                label: Red
                value: adw-accent-red
            -
                label: Pink
                value: adw-accent-pink
            -
                label: Purple
                value: adw-accent-purple
            -
                label: Slate
                value: adw-accent-slate
    -
        id: adw-compact
        title: Compact rows
        description: Smaller buttons, inputs and sidebar rows
        type: class-toggle
    -
        id: adw-properties-flat
        title: Flat properties
        description: Remove the card background behind the properties in notes
        type: class-toggle
    -
        id: file-line-width
        title: Reading width
        description: Maximum width of note text
        type: variable-number-slider
        default: 760
        min: 520
        max: 1200
        step: 20
        format: px

    -
        title: Window Buttons
        description: Style of minimize, maximize and close window buttons
        type: heading
        level: 2
        collapsed: true
    -
        id: adwaita-mod
        title: Enable
        description: Whether to use the Adwaita style window buttons
        type: class-select
        default: adwaita-mod-linux-only
        allowEmpty: false
        options:
            -
                label: Always
                value: adwaita-mod-always
            -
                label: Linux Only
                value: adwaita-mod-linux-only
            -
                label: Never
                value: adwaita-mod-never
    -
        id: adwaita-mod-scale
        title: Scale
        type: variable-number
        default: 1
    -
        id: adwaita-mod-right-margin
        title: Right Margin
        type: variable-number
        default: 8
        format: px
    -
        id: adwaita-window-button-minimize-hide
        title: Hide minimize button
        type: class-toggle
    -
        id: adwaita-window-button-maximize-hide
        title: Hide maximize button
        type: class-toggle
    -
        id: adwaita-window-button-close-hide
        title: Hide close button
        type: class-toggle

    -
        title: Tabs
        type: heading
        level: 2
        collapsed: true
    -
        id: adwaita-tabs
        title: Enable
        description: Whether to use the Adwaita style tabs
        type: class-select
        default: adwaita-tabs-linux-only
        allowEmpty: false
        options:
            -
                label: Always
                value: adwaita-tabs-always
            -
                label: Linux Only
                value: adwaita-tabs-linux-only
            -
                label: Never
                value: adwaita-tabs-never
    -
        id: adwaita-tabs-short
        title: Short
        type: class-toggle

    -
        title: Header bar
        type: heading
        level: 2
        collapsed: true
    -
        id: adwaita-colors
        title: Enable
        description: Color the title bar, tab bar and note headers like a GNOME header bar
        type: class-select
        default: adwaita-colors-linux-only
        allowEmpty: false
        options:
            -
                label: Always
                value: adwaita-colors-always
            -
                label: Linux Only
                value: adwaita-colors-linux-only
            -
                label: Never
                value: adwaita-colors-never

    -
        title: Font
        type: heading
        level: 2
        collapsed: true
    -
        id: adwaita-font
        title: Enable
        description: Use Adwaita Sans / Cantarell (must be installed on the system)
        type: class-select
        default: adwaita-font-linux-only
        allowEmpty: false
        options:
            -
                label: Always
                value: adwaita-font-always
            -
                label: Linux Only
                value: adwaita-font-linux-only
            -
                label: Never
                value: adwaita-font-never

    -
        title: Icons
        type: heading
        level: 2
        collapsed: true
    -
        id: adwaita-icon
        title: Enable
        description: Use Adwaita symbolic icons for window chrome
        type: class-select
        default: adwaita-icons-linux-only
        allowEmpty: false
        options:
            -
                label: Always
                value: adwaita-icons-always
            -
                label: Linux Only
                value: adwaita-icons-linux-only
            -
                label: Never
                value: adwaita-icons-never
